<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StillWater — Find the still water</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root {
  --brand: #0e7490;
  --brand-soft: #e0f2f7;
  --ink: #0f172a;
  --ink-2: #475569;
  --surface: #ffffff;
  --surface-2: #f8fafc;
  --line: #e2e8f0;
  --risk-high: #dc2626;
  --risk-med: #d97706;
  --risk-low: #16a34a;
  --risk-review: #7c3aed;
  --notseen: #64748b;
  --radius: 12px;
  --radius-sm: 8px;
  --shadow: 0 1px 2px rgb(0 0 0 / .06), 0 4px 12px rgb(0 0 0 / .04);
  --gap: 8px;
}
:root { color-scheme: light; }
:root[data-theme="dark"] {
  color-scheme: dark;
  --ink: #e2e8f0;
  --ink-2: #94a3b8;
  --surface: #0f172a;
  --surface-2: #1e293b;
  --line: #334155;
  --brand-soft: #164e63;
  --brand: #22a6c7;
}
.theme-toggle {
  display: inline-flex; align-items: center; justify-content: center;
  width: 44px; height: 44px; margin-left: 8px;
  border: 1px solid var(--line); border-radius: 999px;
  background: var(--surface); color: var(--ink); cursor: pointer;
  transition: background .15s ease, border-color .15s ease;
}
.theme-toggle:hover { border-color: var(--brand); }
.theme-toggle:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.theme-toggle .icon-moon { display: none; }
:root[data-theme="dark"] .theme-toggle .icon-sun { display: none; }
:root[data-theme="dark"] .theme-toggle .icon-moon { display: inline; }
* {
  box-sizing: border-box;
}
html {
  scroll-behavior: smooth;
}
@media (prefers-reduced-motion: reduce) {
  html {
    scroll-behavior: auto;
  }
  * {
    transition: none !important;
    animation: none !important;
  }
}
body {
  margin: 0;
  font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  background: var(--surface-2);
  color: var(--ink);
  font-size: 16px;
  line-height: 1.5;
}
a {
  color: var(--brand);
}
:focus-visible {
  outline: 2px solid var(--brand);
  outline-offset: 2px;
  border-radius: 4px;
}
button, input, select {
  font: inherit;
  min-height: 44px;
}
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background: var(--brand);
  color: #fff;
  border: 0;
  border-radius: var(--radius-sm);
  padding: 10px 18px;
  cursor: pointer;
  transition: opacity .18s ease-out, transform .18s ease-out;
}
.btn:disabled {
  opacity: .5;
  cursor: not-allowed;
}
.btn-secondary {
  background: transparent;
  color: var(--brand);
  border: 1px solid var(--brand);
}
.topbar {
  position: sticky;
  top: 0;
  z-index: 50;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}
.topbar-inner {
  max-width: 1100px;
  margin: 0 auto;
  padding: 8px 16px;
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
}
.logo {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 700;
  text-decoration: none;
  color: var(--ink);
}
.nav {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.nav a {
  text-decoration: none;
  color: var(--ink-2);
  padding: 8px 14px;
  border-radius: 999px;
  border: 1px solid transparent;
  min-height: 44px;
  display: inline-flex;
  align-items: center;
}
.nav a.active {
  color: var(--brand);
  background: var(--brand-soft);
  border-color: var(--line);
}
.status-pill {
  margin-left: auto;
  font-size: 12px;
  border-radius: 999px;
  padding: 6px 12px;
  border: 1px solid var(--line);
  background: var(--surface-2);
}
.status-pill.ok {
  color: var(--risk-low);
  border-color: var(--risk-low);
}
.status-pill.off {
  color: var(--risk-high);
  border-color: var(--risk-high);
}
.banner {
  background: #fef2f2;
  color: #991b1b;
  border-bottom: 1px solid #fecaca;
  padding: 8px 16px;
  text-align: center;
  font-size: 14px;
}
main {
  max-width: 1100px;
  margin: 0 auto;
  padding: 24px 16px 64px;
}
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 16px;
  margin-bottom: 16px;
}
.hero h1 {
  font-size: 28px;
  margin: 0 0 8px;
  letter-spacing: -0.02em;
}
.hero p {
  margin: 0 0 16px;
  color: var(--ink-2);
}
.dropzone {
  border: 2px dashed var(--line);
  border-radius: var(--radius);
  padding: 24px;
  text-align: center;
  background: var(--surface-2);
  cursor: pointer;
  transition: border-color .18s ease-out, background .18s ease-out;
}
.dropzone.drag {
  border-color: var(--brand);
  background: var(--brand-soft);
}
.dropzone strong {
  display: block;
  margin-bottom: 8px;
}
.preview {
  margin-top: 16px;
  display: flex;
  gap: 16px;
  align-items: flex-start;
  flex-wrap: wrap;
}
.preview img, .preview video {
  max-width: 280px;
  width: 100%;
  border-radius: var(--radius-sm);
  border: 1px solid var(--line);
}
.field {
  margin: 16px 0;
}
.field label {
  display: block;
  font-weight: 600;
  margin-bottom: 8px;
}
.field input[type="text"] {
  width: 100%;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
}
.help {
  font-size: 14px;
  color: var(--ink-2);
}
.error {
  font-size: 14px;
  color: var(--risk-high);
}
.progress-bar {
  height: 8px;
  background: var(--line);
  border-radius: 999px;
  overflow: hidden;
  margin-top: 8px;
}
.progress-bar span {
  display: block;
  height: 100%;
  background: var(--brand);
  width: 0%;
  transition: width .2s ease-out;
}
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
.scan-progress-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-top: 24px; }
.scan-progress-head strong { font-size: 2rem; line-height: 1; color: var(--brand); font-variant-numeric: tabular-nums; }
.scan-progress-head p { margin: 0; font-weight: 600; }
.scan-progress-bar { height: 14px; margin: 14px 0 8px; background: var(--line); border-radius: 999px; overflow: hidden; }
.scan-progress-bar span { display: block; height: 100%; width: 0; border-radius: inherit; background: var(--brand); transition: width .8s ease-out; }
.stage-unknown { height: 4px; margin: 12px 0; overflow: hidden; border-radius: 999px; background: var(--line); }
.stage-unknown::after { content: ""; display: block; height: 100%; width: 35%; background: var(--brand); opacity: .65; animation: scan-shimmer 1.5s ease-in-out infinite alternate; }
@keyframes scan-shimmer { from { transform: translateX(0); } to { transform: translateX(185%); } }
.scan-steps { list-style: none; padding: 0; margin: 24px 0; display: grid; gap: 8px; }
.scan-steps li { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border: 1px solid var(--line); border-radius: var(--radius-sm); color: var(--ink-2); background: var(--surface-2); }
.scan-steps li.active { border-color: var(--brand); color: var(--ink); background: var(--brand-soft); font-weight: 600; }
.scan-steps li.done { color: var(--ink); }
.scan-steps .step-mark { width: 24px; height: 24px; flex: none; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 50%; font-size: 12px; }
.scan-steps .done .step-mark { color: var(--risk-low); border-color: var(--risk-low); }
.scan-steps .active .step-mark { color: var(--brand); border-color: var(--brand); }
.scan-steps .step-time { margin-left: auto; font-size: 13px; color: var(--ink-2); font-weight: 400; }
.stepper {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 8px 0;
  list-style: none;
  margin: 0;
}
.stepper li {
  flex: 1 0 90px;
  min-width: 90px;
  text-align: center;
  font-size: 12px;
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 8px 6px;
  background: var(--surface-2);
  color: var(--ink-2);
}
.stepper li.done {
  border-color: var(--risk-low);
  color: var(--risk-low);
}
.stepper li.active {
  border-color: var(--brand);
  color: var(--brand);
  background: var(--brand-soft);
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
  gap: 16px;
}
.stat-cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap: 8px;
  margin-bottom: 16px;
}
.stat small { display: block; margin-top: 6px; font-size: 11px; line-height: 1.3; color: var(--ink-2); }
.stat {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 12px;
  text-align: center;
}
.stat b {
  display: block;
  font-size: 20px;
  font-variant-numeric: tabular-nums;
}
.stat span {
  font-size: 12px;
  color: var(--ink-2);
}
.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  border-radius: 999px;
  padding: 4px 10px;
  font-size: 12px;
  font-weight: 700;
  border: 1px solid;
}
.badge.high {
  color: var(--risk-high);
  border-color: var(--risk-high);
}
.badge.medium {
  color: var(--risk-med);
  border-color: var(--risk-med);
}
.badge.low {
  color: var(--risk-low);
  border-color: var(--risk-low);
}
.badge.review {
  color: var(--risk-review);
  border-color: var(--risk-review);
}
.badge.notseen {
  color: var(--notseen);
  border-color: var(--notseen);
}
.thumb {
  width: 100%;
  aspect-ratio: 4 / 3;
  object-fit: cover;
  background: var(--surface-2);
  border-radius: var(--radius-sm);
  border: 1px solid var(--line);
}
.checks-toggle { margin-top: 10px; }
.checks-panel { margin-top: 10px; padding: 10px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; color: var(--ink); }
.checks-panel[hidden] { display: none; }
.checks-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
.checks-grid > * { min-width: 0; overflow-wrap: anywhere; }
.checks-heading { font-size: .85rem; font-weight: 700; }
.checks-row { padding: 7px 0 7px 8px; border-left: 3px solid transparent; border-top: 1px solid var(--line); }
.checks-row.differ { border-left-color: var(--risk-review); }
.checks-row-title { font-size: .8rem; color: var(--ink-2); margin-bottom: 4px; }
.checks-differ { color: var(--risk-review); font-weight: 700; }
.checks-summary { margin: 8px 0 0; font-size: .85rem; font-weight: 700; }
.card.risk-high, .order-card.high {
  border: 2px solid var(--risk-high);
  background: color-mix(in srgb, var(--risk-high) 6%, var(--surface));
}
.order-card.high { border-left-width: 8px; }
.order-card.medium { border-left: 8px solid var(--risk-med); }
.order-card.review { border-left: 8px solid var(--risk-review); }
.order-card.low { border-left: 8px solid var(--risk-low); }
.card.risk-high .thumb { border-color: var(--risk-high); }
.order-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
.order-card.high strong { color: var(--risk-high); }
.samples {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 8px;
}
.new-layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; align-items: start; }
.new-layout > .card { margin: 0; }
@media (min-width: 800px) {
  .new-layout { grid-template-columns: minmax(0, 1.7fr) minmax(300px, 1fr); }
  .new-layout > :last-child { position: sticky; top: 76px; }
  .new-layout .demos { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .new-layout .demo-img img { height: 96px; }
  .new-layout .demo-blurb { display: none; }
  .hero .hero-actions { display: none; }
  .hero { padding-top: 12px; padding-bottom: 12px; }
  .hero h1 { font-size: 26px; margin-bottom: 4px; }
  .hero p { font-size: 15px; margin: 0; }
  .new-layout h2 { margin-top: 0; }
  .new-layout .card > .help { margin-top: 4px; }
}
@media (min-width: 1100px) { .new-layout .demos { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
#demoSection { scroll-margin-top: 76px; }
.hero-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
.demos {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
  gap: 12px;
}
.demo {
  display: block;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--surface);
  overflow: hidden;
  color: var(--ink);
  text-decoration: none;
}
.demo:hover, .demo:focus-visible { outline: 2px solid var(--brand); }
.demo-img { position: relative; }
.demo-img img { width: 100%; height: 130px; object-fit: cover; display: block; }
.demo-kind {
  position: absolute; top: 8px; left: 8px;
  font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px;
  background: rgba(0,0,0,.65); color: #fff;
}
.demo-body { padding: 10px; display: grid; gap: 4px; }
.demo-counts { font-size: 12px; font-weight: 600; }
.demo-check { text-decoration: underline dotted; text-underline-offset: 3px; cursor: help; }
.demo-blurb { font-size: 12px; color: var(--ink-2); }
.sample {
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--surface);
  padding: 0;
  overflow: hidden;
  cursor: pointer;
  text-align: left;
  color: var(--ink);
}
.sample img {
  width: 100%;
  height: 90px;
  object-fit: cover;
  display: block;
}
.sample span {
  display: block;
  font-size: 12px;
  padding: 8px;
}
.sample.selected {
  outline: 2px solid var(--brand);
}
#map {
  height: 420px;
  border-radius: var(--radius);
  border: 1px solid var(--line);
}
.compare-cols {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 8px;
}
.compare-col {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 12px;
  background: var(--surface);
}
.compare-col h3 {
  margin: 0 0 8px;
  font-size: 14px;
}
.compare-col.fixed {
  border-top: 4px solid var(--risk-low);
}
.compare-col.risky {
  border-top: 4px solid var(--risk-high);
}
.compare-col.new {
  border-top: 4px solid var(--risk-med);
}
.compare-col.notseen {
  border-top: 4px solid var(--notseen);
}
.order-skel { display: flex; gap: 12px; align-items: flex-start; }
.skeleton.skel-thumb { width: 120px; height: 90px; min-height: 0; flex: none; }
.skel-body { flex: 1; display: grid; gap: 10px; }
.skeleton.skel-line { height: 14px; min-height: 0; width: 100%; }
.skeleton.skel-line.short { width: 25%; }
.skeleton.skel-line.mid { width: 60%; }
.skeleton.skel-scan-thumb { width: 96px; aspect-ratio: 4 / 3; min-height: 0; flex: none; }
.skeleton.skel-line.chips-skel { width: 40%; height: 22px; border-radius: 999px; }
.scan-skel .skel-body { flex: 1; }
@media (prefers-reduced-motion: reduce) { .skeleton { animation: none; } }
.skeleton {
  background: linear-gradient(90deg, var(--line) 25%, var(--surface-2) 50%, var(--line) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.2s infinite;
  border-radius: var(--radius-sm);
  min-height: 60px;
}
@keyframes shimmer {
  to {
    background-position: -200% 0;
  }
}
.empty {
  text-align: center;
  color: var(--ink-2);
  padding: 32px 16px;
  border: 1px dashed var(--line);
  border-radius: var(--radius);
  background: var(--surface);
}
.spinner {
  width: 22px;
  height: 22px;
  border: 3px solid var(--line);
  border-top-color: var(--brand);
  border-radius: 50%;
  display: inline-block;
  animation: spin 1s linear infinite;
  vertical-align: middle;
}
@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}
.lightbox {
  position: fixed;
  inset: 0;
  background: rgb(0 0 0 / .8);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 100;
  padding: 16px;
}
.lightbox.open {
  display: flex;
}
.lightbox img {
  max-width: 95vw;
  max-height: 90vh;
  border-radius: var(--radius);
}
.order-card {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 12px;
  background: var(--surface);
}
.toggle-row {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
}
.toggle-row button {
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  padding: 8px 16px;
  cursor: pointer;
}
.toggle-row button.active {
  background: var(--brand);
  color: #fff;
  border-color: var(--brand);
}
.disclosure {
  font-size: 12px;
  color: var(--ink-2);
  margin-top: 16px;
}
footer {
  text-align: center;
  color: var(--ink-2);
  font-size: 12px;
  padding: 24px;
}
.video-wrap video, .video-wrap img {
  width: 100%;
  border-radius: var(--radius);
  border: 1px solid var(--line);
  background: #000;
}
@media (max-width: 600px) {
  .hero h1 {
    font-size: 22px;
  }
  main {
    padding: 16px 12px 48px;
  }
}
@media print {
  .topbar, .nav, .banner, .btn, .toggle-row, footer, #map {
    display: none !important;
  }
  main {
    max-width: none;
  }
  .card, .order-card {
    box-shadow: none;
    break-inside: avoid;
  }
}

.sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
.scan-row { display:flex; align-items:center; gap:14px; padding:12px; border:1px solid var(--line); border-radius:var(--radius); margin:10px 0; color:var(--ink); text-decoration:none; min-width:0; }
.scan-row img, .scan-placeholder { width:96px; aspect-ratio:4/3; object-fit:cover; border-radius:6px; background:var(--surface-2); flex:none; }
.scan-placeholder { display:grid; place-items:center; font-size:28px; } .scan-row-body, .order-body { min-width:0; overflow-wrap:anywhere; } .muted { opacity:.65; }
.chips, .map-legend { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0; } .legend-high { color:var(--risk-high); } .legend-medium { color:var(--risk-med); } .legend-review { color:var(--risk-review); } .legend-low { color:var(--risk-low); }
.order-layout { display:flex; align-items:flex-start; gap:12px; } .order-check { display:flex; align-items:center; flex:none; } .order-check input { width:20px; height:20px; min-height:20px; margin:0; } .order-image { width:120px; aspect-ratio:4/3; object-fit:cover; border-radius:6px; flex:none; } .order-body h3 { margin:8px 0 2px; } .why-button { background:transparent; color:var(--brand); border:0; padding:8px 0; cursor:pointer; font:inherit; text-decoration:underline; } .rule-label { display:block; color:var(--ink-2); }
.how-step { margin-bottom:18px; } .how-step p { margin:4px 0; } .table-scroll { max-width:100%; overflow-x:auto; } .eval-table { min-width:850px; } .eval-table, .rules-table { border-collapse:collapse; } .eval-table th, .eval-table td, .rules-table td { padding:8px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; } .rules-table td:first-child { white-space:nowrap; font-weight:700; }
@media (max-width:600px) { .order-image { width:80px; } .scan-row img, .scan-placeholder { width:72px; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; scroll-behavior:auto !important; transition-duration:.01ms !important; } }
</style>

<script>
(function () {

  var scanningAvailable = false;
  var lang = "en";
  var state = { file: null, fileUrl: null, sampleName: "", area: "", lat: null, lng: null };
  var pollTimer = null;
  var evtSource = null;
  var elapsedTimer = null;
  var elapsedSec = 0;
  var SAMPLES = ["puddle.jpg", "street-puddle.jpg", "rooftop-pots.jpg", "wet-basin.jpg", "bin-with-trash.jpg", "drain-grate.jpg"];
  var STEPS7 = ["ingest", "privacy", "scout", "track", "verify", "decide", "act"];
  var STEP_LABEL = { ingest: "Ingest", privacy: "Privacy", scout: "Scout", track: "Track", verify: "Verify", decide: "Decide", act: "Orders" };
  var IMAGE_STEPS = ["privacy", "scout", "verify", "decide"];
  function t(bn, en) {

    if (pollTimer) {
      clearInterval(pollTimer);
      pollTimer = null;
    }

      clearInterval(elapsedTimer);
      elapsedTimer = null;

  function el(tag, cls, text) {
    var n = document.createElement(tag);

      n.className = cls;
    }
    if (text !== undefined && text !== null) {
      n.textContent = text;
    }
    return n;
  }
  function fmtSize(b) {
    if (b < 1024) {
      return b + " B";
    }
    if (b < 1048576) {
      return (b / 1024).toFixed(1) + " KB";
    }
    return (b / 1048576).toFixed(1) + " MB";
  }
  function fmtTime(s) {
    var m = Math.floor(s / 60);
    var r = Math.floor(s % 60);
    return m + ":" + (r < 10 ? "0" + r : r);
  }
  function fmtCost(v) {
    if (v === undefined || v === null || v === "") {
      return "—";
    }
    var n = Number(v);
    if (!isFinite(n)) {
      return "—";
    }
    if (n <= 0) {
      return "$0.00";
    }
    if (n < 0.01) {
      return "<$0.01";
    }
    return "$" + n.toFixed(2);
  }
  function annotatedAvailable(man) {
    if (!man || typeof man !== "object") {
      return false;
    }
    var keys = ["has_annotated_media", "annotated_exists", "has_annotated", "annotated_available", "annotated", "has_annotated_image", "has_annotated_video", "annotated_media"];
    for (var i = 0; i < keys.length; i++) {
      var k = keys[i];
      if (man[k] === true) {
        return true;
      }
      if (man[k] === false) {
        return false;
      }
    }
    if (typeof man.annotated_url === "string") {
      return man.annotated_url.length > 0;
    }
    if (typeof man.annotated_path === "string") {
      return man.annotated_path.length > 0;
    }
    var conts = man.containers || [];
    return conts.length > 0;
  }
  var RISK_RANK = { high: 0, medium: 1, review: 2, low: 3, fixed: 3 };
  function sortedByRisk(conts) {
    return conts.map(function (cc, i) { return { cc: cc, i: i }; }).sort(function (a, b) {
      var ra = RISK_RANK[riskClass(a.cc)], rb = RISK_RANK[riskClass(b.cc)];
      return (ra === undefined ? 2 : ra) - (rb === undefined ? 2 : rb) || a.i - b.i;
    });
  }
  function riskClass(c) {
    var r = String(c.risk || c.worst || "review").toLowerCase();
    if (r.indexOf("high") >= 0) {
      return "high";
    }
    if (r.indexOf("med") >= 0) {
      return "medium";
    }
    if (r.indexOf("low") >= 0 || r.indexOf("fix") >= 0) {
      return "low";
    }
    return "review";
  }
  function riskIcon(cls) {
    if (cls === "high") {
      return "▲ ";
    }
    if (cls === "medium") {
      return "● ";
    }
    if (cls === "low") {
      return "✔ ";
    }
    return "◆ ";
  }
  async function checkHealth() {
    try {
      var r = await fetch("/api/health");
      var j = await r.json();
      scanningAvailable = j.scanning_available === true;
    } catch (e) {
      scanningAvailable = false;
    }

    healthPill.className = "status-pill " + (scanningAvailable ? "ok" : "off");
    scanBanner.hidden = scanningAvailable;
  }
  function setNav(route) {
    var links = document.querySelectorAll(".nav a");
    links.forEach(function (a) {
      if (a.getAttribute("data-route") === route) {
        a.classList.add("active");
      } else {
        a.classList.remove("active");
      }
    });
  }
  function router() {
    clearTimers();
    var h = location.hash || "#/new";
    var parts = h.replace("#/", "").split("/");
    if (parts[0] === "new" || parts[0] === "") {
      setNav("new");
      renderNew();
    } else if (parts[0] === "scans" && !parts[1]) {
      setNav("scans");
      renderScans();
    } else if (parts[0] === "scan" && parts[1] && parts[2] === "compare") {
      setNav("scans");
      renderCompare(parts[1]);
    } else if (parts[0] === "scan" && parts[1]) {
      setNav("scans");
      renderScan(parts[1]);
    } else if (parts[0] === "map") {
      setNav("map");
      renderMap();
    } else if (parts[0] === "orders") {
      setNav("orders");
      renderOrders();
    } else if (parts[0] === "how") {
      setNav("how");
      renderHow();
    } else {
      setNav("new");
      renderNew();
    }
  }
  function heroCard() {
    var d = el("div", "card hero");
    var h = el("h1", null, "Find the still water before the mosquitoes do.");

    d.appendChild(h);
    d.appendChild(p);
    var row = el("div", "hero-actions");
    var scanBtn = el("button", "btn", "Scan a photo or video");

    row.appendChild(scanBtn); d.appendChild(row);
    return d;
  }
  function openUpload() {
    var fi = document.querySelector("#dropzone input[type=file]");
    if (fi) { fi.click(); }
  }
  var reviewHint = "The two AI checks disagreed or were unsure, so a person should look.";
  function renderNew() {
    app.textContent = "";
    app.appendChild(heroCard());
    var c = el("div", "card");
    c.appendChild(el("h2", null, "One-click demos"));
    c.appendChild(el("p", "help", "Real scans from Dhaka, recorded Nov 3. Tap one to see the full result instantly: evidence photos, risk levels and bilingual work orders."));
    var gal = el("div", "demos");
    c.appendChild(gal);
    fetch("/samples/demos.json", { cache: "no-cache" }).then(function (r) { return r.ok ? r.json() : []; }).then(function (list) {
      list.forEach(function (d) {
        var a = el("a", "demo");
        a.href = "#/scan/" + encodeURIComponent(d.scan_id);
        if (d.counts && d.counts.review) a.title = reviewHint;
        a.setAttribute("aria-label", d.title + " (" + d.kind + "), open result");
        var wrap = el("div", "demo-img");
        var img = document.createElement("img");
        img.loading = "lazy"; img.alt = ""; img.src = "/samples/" + d.thumb;
        wrap.appendChild(img);
        wrap.appendChild(el("span", "demo-kind " + d.kind, d.kind === "video" ? "Video" : "Photo"));
        a.appendChild(wrap);
        var body = el("div", "demo-body");
        body.appendChild(el("strong", null, d.title));
        var k = d.counts || {}, total = (k.high || 0) + (k.medium || 0) + (k.review || 0) + (k.low || 0);
        var line = el("span", "demo-counts");
        if (!total) { line.textContent = "No containers found"; }
        else {
          line.appendChild(el("b", null, total + " found: "));
          var parts = [];
          if (k.high) parts.push(k.high + " high");
          if (k.medium) parts.push(k.medium + " medium");
          if (k.low) parts.push(k.low + " low");
          line.appendChild(document.createTextNode(parts.join(" · ")));
          if (k.review) {
            if (parts.length) { line.appendChild(document.createTextNode(" · ")); }
            var chk = el("span", "demo-check", k.review + " need a check");
            chk.title = reviewHint;
            line.appendChild(chk);
          }
        }
        body.appendChild(line);
        body.appendChild(el("span", "demo-blurb", d.blurb));
        a.appendChild(body);
        gal.appendChild(a);
      });
    }).catch(function () {});
    c.id = "demoSection";
    var u = el("div", "card");
    u.appendChild(el("h2", null, "New scan — photo or video"));
    var dz = el("div", "dropzone");
    dz.id = "dropzone";
    dz.tabIndex = 0;
    dz.setAttribute("role", "button");
    dz.setAttribute("aria-label", "Upload a photo or video. Activate to browse files.");
    var dzTitle = el("strong", null, "Drag and drop a photo or video here, click to browse, or paste an image (Ctrl+V)");
    var dzSub = el("div", "help", "Photos JPG/PNG/WebP up to 15 MB · Videos MP4/MOV/WebM up to 200 MB, 60 s");
    dz.appendChild(dzTitle);
    dz.appendChild(dzSub);
    var fileInput = document.createElement("input");
    fileInput.type = "file";
    fileInput.accept = "image/*,video/*";
    fileInput.hidden = true;
    fileInput.setAttribute("aria-label", "Choose a photo or video file");
    dz.appendChild(fileInput);
    var prev = el("div", "preview");
    prev.id = "previewBox";
    dz.appendChild(prev);
    u.appendChild(dz);
    var msg = el("p", "error", "");
    msg.id = "fileMsg";
    msg.setAttribute("aria-live", "assertive");
    u.appendChild(msg);
    var bar = el("div", "progress-bar");
    bar.hidden = true;
    bar.id = "upBar";
    var fill = el("span");
    bar.appendChild(fill);
    u.appendChild(bar);
    var f1 = el("div", "field");
    var lab = el("label", null, "Area label");
    lab.htmlFor = "areaInput";
    var areaIn = document.createElement("input");
    areaIn.type = "text";
    areaIn.id = "areaInput";
    areaIn.maxLength = 200;
    areaIn.placeholder = "e.g. Mirpur Block C, rooftop";
    areaIn.value = state.area || "";
    areaIn.addEventListener("input", function () {
      state.area = areaIn.value;
    });
    f1.appendChild(lab);
    f1.appendChild(areaIn);
    u.appendChild(f1);
    var locRow = el("div", null, "");
    var locBtn = el("button", "btn btn-secondary", "Use my location");
    locBtn.type = "button";
    var locMsg = el("span", "help", state.lat !== null ? "Location set." : " Location optional.");
    locMsg.style.marginLeft = "8px";
    locBtn.addEventListener("click", function () {
      if (!navigator.geolocation) {
        locMsg.textContent = " Geolocation is not available.";
        return;
      }
      locMsg.textContent = " Locating…";
      navigator.geolocation.getCurrentPosition(function (pos) {
        state.lat = pos.coords.latitude;
        state.lng = pos.coords.longitude;
        locMsg.textContent = " Location set (" + state.lat.toFixed(3) + ", " + state.lng.toFixed(3) + ").";
      }, function () {
        locMsg.textContent = " Could not get location. Continuing without it.";
      });
    });
    locRow.appendChild(locBtn);
    locRow.appendChild(locMsg);
    u.appendChild(locRow);
    var start = el("button", "btn", "Start scan");
    start.id = "startBtn";
    start.style.marginTop = "16px";
    start.disabled = true;
    start.addEventListener("click", startUpload);
    u.appendChild(start);
    var layout = el("div", "new-layout");
    layout.appendChild(c);
    layout.appendChild(u);
    app.appendChild(layout);
    renderPreview();
    dz.addEventListener("click", function (e) {
      if (e.target !== fileInput) {
        fileInput.click();
      }
    });
    dz.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") {

      }
    });
    dz.addEventListener("dragover", function (e) {
      e.preventDefault();
      dz.classList.add("drag");
    });
    dz.addEventListener("dragleave", function () {

    });

        pickFile(e.dataTransfer.files[0]);
      }
    });
    fileInput.addEventListener("change", function () {
      if (fileInput.files.length) {
        pickFile(fileInput.files[0]);
      }
    });
    document.addEventListener("paste", handlePaste);
  }
  function handlePaste(e) {
    if (!document.getElementById("previewBox")) {
      return;
    }
    var items = (e.clipboardData && e.clipboardData.files) || [];
    if (items.length) {
      pickFile(items[0]);
    }
  }
  function pickFile(f) {
    var msg = document.getElementById("fileMsg");
    var name = f.name || "pasted-image.png";
    var ext = name.split(".").pop().toLowerCase();
    var isImg = /image/.test(f.type) || ["jpg", "jpeg", "png", "webp"].indexOf(ext) >= 0;
    var isVid = /video/.test(f.type) || ["mp4", "mov", "webm"].indexOf(ext) >= 0;
    if (!isImg && !isVid) {
      if (msg) {
        msg.textContent = "That file type is not supported. Use a JPG, PNG, WebP photo or an MP4, MOV, WebM video.";
      }
      return;
    }
    var limit = isImg ? 15 * 1048576 : 200 * 1048576;
    if (f.size > limit) {
      if (msg) {
        msg.textContent = "That file is " + fmtSize(f.size) + "; " + (isImg ? "photos can be up to 15 MB." : "videos can be up to 200 MB.");
      }
      return;
    }
    if (isVid && msg) {
      msg.textContent = "";
    } else if (msg) {
      msg.textContent = "";
    }
    if (state.fileUrl) {
      try {
        URL.revokeObjectURL(state.fileUrl);
      } catch (e) {}
    }
    state.file = f;
    state.fileUrl = URL.createObjectURL(f);
    state.sampleName = "";
    if (!state.area) {
      state.area = name.replace(/\.[^.]+$/, "").replace(/[-_]+/g, " ");
      var ai = document.getElementById("areaInput");
      if (ai) {
        ai.value = state.area;
      }
    }
    renderPreview();
  }
  async function selectSample(name, btn) {
    document.querySelectorAll(".sample").forEach(function (b) {
      b.classList.remove("selected");
    });
    if (btn) {
      btn.classList.add("selected");
    }
    try {
      var r = await fetch("/samples/" + name);
      var b = await r.blob();
      var f = new File([b], name, { type: "image/jpeg" });
      if (state.fileUrl) {
        try {
          URL.revokeObjectURL(state.fileUrl);
        } catch (e) {}
      }
      state.file = f;
      state.fileUrl = URL.createObjectURL(f);
      state.sampleName = name;
      state.area = name.replace(".jpg", "").replace(/-/g, " ");
      var ai = document.getElementById("areaInput");
      if (ai) {
        ai.value = state.area;
      }
      var go = document.getElementById("sampleGo");
      if (go) {
        go.disabled = false;
      }
      renderPreview();
    } catch (e) {
      var msg = document.getElementById("fileMsg");
      if (msg) {
        msg.textContent = "Could not load that sample. Please try another.";
      }
    }
  }
  function renderPreview() {
    var box = document.getElementById("previewBox");
    var start = document.getElementById("startBtn");
    if (!box) {
      return;
    }
    box.textContent = "";
    if (!state.file) {
      if (start) {
        start.disabled = true;
      }
      return;
    }
    var isVid = /video/.test(state.file.type) || /\.(mp4|mov|webm)$/i.test(state.file.name);
    var media;
    if (isVid) {
      media = document.createElement("video");
      media.src = state.fileUrl;
      media.controls = true;
      media.muted = true;
      media.preload = "metadata";
      media.addEventListener("loadedmetadata", function () {
        dur.textContent = fmtSize(state.file.size) + " · " + fmtTime(media.duration || 0) + " · " + state.file.name;
      });
    } else {
      media = document.createElement("img");
      media.src = state.fileUrl;
      media.alt = "Selected photo preview";
    }
    box.appendChild(media);
    var meta = el("div", null, "");
    var nm = el("div", null, state.file.name + " · " + fmtSize(state.file.size));
    var dur = el("div", "help", fmtSize(state.file.size));
    meta.appendChild(nm);
    meta.appendChild(dur);
    var rm = el("button", "btn btn-secondary", "Remove");
    rm.type = "button";
    rm.addEventListener("click", function (ev) {
      ev.stopPropagation();
      if (state.fileUrl) {
        try {
          URL.revokeObjectURL(state.fileUrl);
        } catch (e) {}
      }
      state.file = null;
      state.fileUrl = null;
      state.sampleName = "";
      renderPreview();
      var go = document.getElementById("sampleGo");
      if (go) {
        go.disabled = true;
      }
    });
    meta.appendChild(rm);
    box.appendChild(meta);
    if (start) {
      start.disabled = false;
    }
  }
  function startUpload() {
    if (!state.file) {
      return;
    }
    if (!state.area || !state.area.trim()) {
      var m = document.getElementById("fileMsg");
      if (m) {
        m.textContent = "Please add an area label (e.g. street or rooftop name).";
      }
      return;
    }
    if (!scanningAvailable) {
      var m2 = document.getElementById("fileMsg");
      if (m2) {
        m2.textContent = "Scanning is offline right now. Please try again later.";
      }
      return;
    }
    var btn = document.getElementById("startBtn") || document.getElementById("sampleGo");
    if (btn) {
      btn.disabled = true;
      btn.innerHTML = "";
      var sp = el("span", "spinner");
      btn.appendChild(sp);
      btn.appendChild(el("span", null, " Uploading…"));
    }
    var bar = document.getElementById("upBar");
    if (bar) {
      bar.hidden = false;
    }
    var xhr = new XMLHttpRequest();
    var fname = encodeURIComponent(state.file.name || "upload.jpg");
    var url = "/api/scans?area=" + encodeURIComponent(state.area.trim()) + "&filename=" + fname + "&background=true";
    if (state.lat !== null && state.lng !== null) {
      url += "&lat=" + state.lat + "&lng=" + state.lng;
    }
    xhr.open("POST", url, true);
    xhr.setRequestHeader("Content-Type", "application/octet-stream");
    xhr.upload.onprogress = function (e) {
      if (e.lengthComputable && bar) {
        bar.firstChild.style.width = Math.round(e.loaded / e.total * 100) + "%";
      }
    };
    xhr.onload = function () {
      try {
        var j = JSON.parse(xhr.responseText || "{}");
        if (xhr.status === 202 && j.scan_id) {
          location.hash = "#/scan/" + j.scan_id;
        } else {
          var err = new Error("bad");
          err.status = xhr.status;
          err.detail = (j && typeof j.detail === "string") ? j.detail : "";
          err.retry = parseInt(xhr.getResponseHeader("Retry-After") || "0", 10);
          throw err;
        }
      } catch (e) {
        var m3 = document.getElementById("fileMsg");
        if (m3) {
          var msg = "We could not start this scan. Please try again or use a different file.";
          if (e && e.status === 429) {
            msg = "Scan limit reached or a scan is already running." + (e.retry > 0 ? " Try again in about " + Math.max(1, Math.ceil(e.retry / 60)) + " min." : " Please wait a moment and try again.");
          } else if (e && e.status === 503) {
            msg = "Scanning is temporarily unavailable. Please try again shortly.";
          } else if (e && (e.status === 400 || e.status === 413) && e.detail) {
            msg = e.detail;
          }
          m3.textContent = msg;
        }
        if (btn) {
          btn.disabled = false;
          btn.textContent = "Start scan";
        }
      }
    };
    xhr.onerror = function () {
      var m4 = document.getElementById("fileMsg");
      if (m4) {
        m4.textContent = "We could not start this scan. Please check your connection and retry.";
      }
      if (btn) {
        btn.disabled = false;
        btn.textContent = "Start scan";
      }
    };
    xhr.send(state.file);
  }
  function scanSkeleton() {
    var d = el("div", "scan-row scan-skel");
    d.setAttribute("aria-hidden", "true");
    d.appendChild(el("div", "skeleton skel-scan-thumb"));
    var b = el("div", "scan-row-body skel-body");
    ["skel-line mid", "skel-line short", "skel-line chips-skel"].forEach(function (cl) { b.appendChild(el("div", "skeleton " + cl)); });
    d.appendChild(b);
    return d;
  }
  async function renderScans() {
    app.textContent = "";
    var c = el("div", "card");
    c.appendChild(el("h2", null, "Scans"));
    var list = el("div", null, "");
    for (var k = 0; k < 6; k++) { list.appendChild(scanSkeleton()); }
    c.appendChild(list);
    app.appendChild(c);
    try {
      var r = await fetch("/api/scans?limit=50");
      var j = await r.json();
      list.textContent = "";
      var scans = j.scans || [];
      if (!scans.length) {
        var emp = el("div", "empty", "No scans yet. Start your first scan — a closer photo of buckets, tyres or pots works best.");
        var b = el("button", "btn", "Start a scan");
        b.addEventListener("click", function () {
          location.hash = "#/new";
        });
        list.appendChild(emp);
        list.appendChild(b);
